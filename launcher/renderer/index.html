<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-iQcWR2XwYPTQNBfrnmMLKoFqy3NV8hqQlWS9FcdRy4o='; img-src 'self' data: blob:; style-src 'self'">
  <title>The Last New Year</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/examples/jsm/":"./vendor/three-jsm/","skinview3d":"../node_modules/skinview3d/libs/skinview3d.js","skinview-utils":"../node_modules/skinview-utils/build/index.js"}}</script>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>

  <header>
    <!-- window buttons in the macOS manner; on macOS itself the system draws its own here -->
    <div id="traffic" class="traffic hidden">
      <button id="win-close" class="light close" title="Закрыть"><svg viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg></button>
      <button id="win-min" class="light min" title="Свернуть"><svg viewBox="0 0 12 12"><path d="M3 6h6"/></svg></button>
      <button id="win-full" class="light full" title="На весь экран"><svg viewBox="0 0 12 12"><path class="fill" d="M3.2 7.6V3.2h4.4zM8.8 4.4v4.4H4.4z"/></svg></button>
    </div>
    <img class="logo" src="logo.png" alt="The Last New Year" draggable="false">
    <button id="open-settings" class="icon-button" title="Настройки">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="stage">
      <canvas id="skin-3d"></canvas>
      <button id="skin-model" class="ghost model-toggle" title="Нажмите, чтобы сменить модель рук"></button>
      <p class="hint center">Потяните мышью, чтобы повернуть</p>
    </section>

    <!-- the middle: empty, or Tetris while the pack installs -->
    <section id="tetris" class="card tetris hidden" aria-label="Тетрис"></section>

    <!-- server over player; slides into the middle when the settings open -->
    <div id="stack" class="stack">
      <section class="card server">
        <div class="card-head">
          <h2>Сервер</h2>
          <div class="server-line"><span id="server-dot" class="dot"></span><b id="server-state">Проверка…</b><span id="server-players" class="muted"></span></div>
        </div>
        <div class="server-line"><span class="muted">Ваш персонаж:</span><b id="life-state">—</b></div>
        <p class="hint" id="server-hint"></p>
      </section>

      <section class="card player">
        <h2>Игрок</h2>
        <label>Никнейм
          <input id="nickname" maxlength="16" placeholder="Латиница, цифры, _" spellcheck="false">
        </label>
        <div class="row">
          <button id="skin-from-nick" class="grow" title="Скопировать скин (и плащ) лицензионного аккаунта с этим ником">Взять скин</button>
          <button id="skin-file" class="grow" title="PNG 64×64 или старый 64×32">Загрузить скин</button>
        </div>
        <div class="class-line">Класс: <b id="player-class">—</b></div>

        <h3>Плащ</h3>
        <div id="capes" class="capes"></div>
        <p class="hint" id="capes-hint"></p>
      </section>
    </div>

    <!-- settings, behind the gear button: slides in on the right -->
    <section id="settings" class="card settings hidden">
      <div class="dialog-head">
        <h2>Настройки</h2>
        <button id="close-settings" class="icon-button small" title="Закрыть">✕</button>
      </div>
      <label>Папка игры
        <div class="row">
          <input id="root" readonly>
          <button id="choose-root">Изменить</button>
          <button id="open-folder" title="Моды, шейдеры, ресурспаки">Открыть</button>
        </div>
      </label>
      <label>Выделенная RAM: <b id="memory-value"></b>
        <input id="memory" type="range" step="512">
        <span class="hint" id="memory-hint"></span>
      </label>
      <label>Громкость заставки (интро): <b id="intro-value"></b>
        <input id="intro-volume" type="range" min="0" max="100" step="1">
      </label>
      <label>Громкость музыки в лаунчере: <b id="music-value"></b>
        <input id="music-volume" type="range" min="0" max="100" step="1">
      </label>
      <label class="switch-row">
        <span>Игра на весь экран</span>
        <input id="game-fullscreen" type="checkbox" class="switch">
      </label>
    </section>
  </main>

  <audio id="music" src="music/end.m4a" loop preload="auto"></audio>

  <footer>
    <div class="status">
      <div id="status-text">Проверка обновлений…</div>
      <div class="bar"><div id="bar-fill"></div></div>
    </div>
    <button id="play" class="play" disabled>ИГРАТЬ</button>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="bg.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="fx.js"></script>
  <script type="module" src="tetris.js"></script>
</body>
</html>
