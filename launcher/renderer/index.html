<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>The Last New Year</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <header>
    <img class="logo" src="logo.png" alt="The Last New Year" draggable="false">
    <div class="win-buttons">
      <button id="fullscreen" class="ghost" title="Полный экран / окно">⤢</button>
      <button id="quit" class="ghost" title="Выйти">✕</button>
    </div>
  </header>

  <main>
    <section class="card player">
      <h2>Игрок</h2>
      <label>Ник
        <input id="nickname" maxlength="16" placeholder="Латиница, цифры, _" spellcheck="false">
      </label>
      <div class="skin">
        <canvas id="skin-canvas" width="160" height="320"></canvas>
        <div class="skin-actions">
          <div class="row">
            <button id="skin-file">Скин из файла</button>
            <select id="skin-model" title="Модель рук">
              <option value="classic">Широкие руки</option>
              <option value="slim">Тонкие руки</option>
            </select>
          </div>
          <div class="row">
            <input id="skin-nick" placeholder="Ник с лицензией" spellcheck="false">
            <button id="skin-from-nick">Взять скин</button>
          </div>
          <p class="hint">Скин увидят все игроки в мире.</p>
        </div>
      </div>
    </section>

    <section class="card settings">
      <h2>Настройки</h2>
      <label>Папка игры
        <div class="row">
          <input id="root" readonly>
          <button id="choose-root">Изменить</button>
        </div>
      </label>
      <label>Память для игры: <b id="memory-value"></b>
        <input id="memory" type="range" step="512">
        <span class="hint" id="memory-hint"></span>
      </label>
      <button id="open-folder" class="ghost wide">Открыть папку игры (моды, шейдеры, ресурспаки)</button>
    </section>
  </main>

  <footer>
    <div class="status">
      <div id="status-text">Проверка обновлений…</div>
      <div class="bar"><div id="bar-fill"></div></div>
    </div>
    <button id="play" class="play" disabled>ИГРАТЬ</button>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
