name: launcher
on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: launcher/dist/*.dmg
          - os: windows-latest
            target: --win
            files: launcher/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Лаунчер ${GITHUB_REF_NAME#launcher-v}" --notes "Скачайте файл для своей системы: .dmg — macOS, .exe — Windows."
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: ${{ matrix.files }}
